<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <meta name="description" content="Anya WebGL2 fragment shader — live render and GLSL source.">
  <title>Anya — Shader Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bar: #181c22;
      --panel: #101318;
      --editor: #0d1014;
      --line: #2b313a;
      --muted: #8994a3;
      --text: #dce5ef;
      --accent: #70e0d6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--panel);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    a {
      color: inherit;
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: 46px minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 15px;
      border-bottom: 1px solid var(--line);
      background: var(--bar);
      box-shadow: 0 1px 12px rgba(0, 0, 0, 0.25);
      z-index: 5;
    }

    .brand,
    .live-state,
    .top-actions {
      display: flex;
      align-items: center;
    }

    .brand {
      gap: 9px;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.11em;
    }

    .brand-dot,
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(112, 224, 214, 0.72);
    }

    .live-state {
      gap: 7px;
      color: var(--muted);
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .live-dot {
      width: 6px;
      height: 6px;
    }

    .top-actions {
      gap: 7px;
    }

    .top-actions a {
      padding: 6px 9px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
    }

    .top-actions a:hover {
      color: var(--text);
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.04);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 54fr) minmax(390px, 46fr);
    }

    .pane {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 36px minmax(0, 1fr);
      background: var(--panel);
    }

    .code-pane {
      border-left: 1px solid var(--line);
      background: var(--editor);
    }

    .panebar {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 11px 0 13px;
      border-bottom: 1px solid var(--line);
      background: #15191f;
      color: var(--muted);
      font: 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .pane-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pane-action {
      padding: 4px 7px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      text-decoration: none;
    }

    .pane-action:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .render-frame {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #080b10;
    }

    .code-scroll {
      position: relative;
      min-height: 0;
      overflow: auto;
      margin: 0;
      padding: 10px 0 36px;
      background: var(--editor);
      tab-size: 4;
      scrollbar-color: #414a57 var(--editor);
      scrollbar-width: thin;
    }

    code {
      display: block;
      min-width: max-content;
      color: #c9d4df;
      font: 12px/1.56 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .code-line {
      display: block;
      min-height: 1.56em;
      padding-right: 24px;
      white-space: pre;
    }

    .code-line::before {
      content: attr(data-line);
      display: inline-block;
      width: 54px;
      margin-right: 15px;
      color: #46515f;
      text-align: right;
      user-select: none;
    }

    .code-line:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .loading,
    .error {
      padding: 18px;
      color: var(--muted);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .error {
      color: #ff9ca6;
    }

    @media (max-width: 820px) {
      .live-state {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(300px, 53fr) minmax(280px, 47fr);
      }

      .code-pane {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .top-actions a:first-child {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>ANYA.GLSL</span>
      </div>
      <div class="live-state" aria-label="实时 WebGL2 渲染">
        <span class="live-dot" aria-hidden="true"></span>
        <span>WEBGL2 LIVE</span>
      </div>
      <nav class="top-actions" aria-label="项目链接">
        <a href="anya_final_shadertoy.glsl">Raw shader</a>
        <a href="https://github.com/rickyyy10/anya-shader">GitHub ↗</a>
      </nav>
    </header>

    <main class="workspace">
      <section class="pane render-pane" aria-label="实时渲染效果">
        <div class="panebar">
          <span class="pane-title">Render</span>
          <a class="pane-action" href="preview.html" target="_blank" rel="noopener">Fullscreen ↗</a>
        </div>
        <iframe
          class="render-frame"
          src="preview.html?embed=1"
          title="Anya 实时 WebGL2 渲染"
          allow="fullscreen"
        ></iframe>
      </section>

      <section class="pane code-pane" aria-label="GLSL 源代码">
        <div class="panebar">
          <span class="pane-title">anya_final_shadertoy.glsl</span>
          <button class="pane-action" id="copy-code" type="button">Copy</button>
        </div>
        <pre class="code-scroll" aria-label="GLSL code"><code id="shader-code"><span class="loading">Loading shader…</span></code></pre>
      </section>
    </main>
  </div>

  <script>
    const codeElement = document.getElementById("shader-code");
    const copyButton = document.getElementById("copy-code");
    let shaderSource = "";

    async function loadShader() {
      try {
        const response = await fetch(`anya_final_shadertoy.glsl?v=${Date.now()}`, {
          cache: "no-store"
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        shaderSource = await response.text();

        const fragment = document.createDocumentFragment();
        shaderSource.split("\n").forEach((sourceLine, index) => {
          const line = document.createElement("span");
          line.className = "code-line";
          line.dataset.line = String(index + 1);
          line.textContent = sourceLine || " ";
          fragment.appendChild(line);
        });
        codeElement.replaceChildren(fragment);
      } catch (error) {
        const message = document.createElement("span");
        message.className = "error";
        message.textContent = `Could not load shader: ${error.message}`;
        codeElement.replaceChildren(message);
      }
    }

    copyButton.addEventListener("click", async () => {
      if (!shaderSource) return;
      await navigator.clipboard.writeText(shaderSource);
      copyButton.textContent = "Copied";
      window.setTimeout(() => {
        copyButton.textContent = "Copy";
      }, 1200);
    });

    loadShader();
  </script>
</body>
</html>
