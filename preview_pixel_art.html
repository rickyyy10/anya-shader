<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anya Pixel-Art Shadertoy Preview</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11131a;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    #status,
    #stats {
      position: fixed;
      z-index: 2;
      margin: 0;
      padding: 9px 11px;
      color: #e8f2ff;
      background: rgba(4, 7, 12, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.16);
      font: 12px/1.45 Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }

    #status {
      left: 12px;
      right: 12px;
      bottom: 12px;
      max-height: 44vh;
      overflow: auto;
      color: #ffd4d4;
    }

    #status:empty {
      display: none;
    }

    #stats {
      top: 12px;
      left: 12px;
      pointer-events: none;
    }

    .home-link {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 3;
      padding: 9px 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: #e8f2ff;
      background: rgba(4, 7, 12, 0.76);
      font: 12px/1.45 Menlo, Consolas, monospace;
      text-decoration: none;
      backdrop-filter: blur(12px);
    }

    .home-link:hover,
    .home-link:focus-visible {
      border-color: rgba(115, 229, 224, 0.72);
      color: #9ff5ef;
    }
  </style>
</head>
<body>
  <a class="home-link" href="index.html" aria-label="返回作品首页">← Project</a>
  <canvas id="canvas"></canvas>
  <pre id="stats" aria-live="polite">Loading GLB data textures…</pre>
  <pre id="status" aria-live="assertive"></pre>

  <script>
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const stats = document.getElementById("stats");
    const gl = canvas.getContext("webgl2", {
      antialias: false,
      alpha: false,
      depth: false,
      stencil: false,
      powerPreference: "high-performance",
      preserveDrawingBuffer: true
    });

    if (!gl) {
      status.textContent = "WebGL 2 is required for uint decoding and texelFetch.";
      throw new Error(status.textContent);
    }

    const parameters = new URLSearchParams(location.search);
    const shaderFile = parameters.get("shader")
      || "anya_final_pixel_art_shadertoy.glsl";
    const manifestFile = parameters.get("manifest")
      || "channels/manifest.json";
    const renderScale = Math.min(1, Math.max(0.2,
      Number(parameters.get("scale") || 1)));
    const timeOffset = Number(parameters.get("timeOffset") || 0);
    const timeScale = Number(parameters.get("timeScale") || 1);
    let loadedChannelCount = 0;

    const vertexSource = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}`;

    function shaderHeader() {
      return `#version 300 es
precision highp float;
precision highp int;
uniform vec3 iResolution;
uniform float iTime;
uniform vec4 iMouse;
uniform sampler2D iChannel0;
uniform sampler2D iChannel1;
uniform sampler2D iChannel2;
uniform sampler2D iChannel3;
uniform vec3 iChannelResolution[4];
out vec4 outColor;
`;
    }

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const error = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(error);
      }
      return shader;
    }

    async function loadText(url) {
      const response = await fetch(`${url}?v=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`Could not load ${url}: ${response.status}`);
      return response.text();
    }

    async function loadJson(url) {
      const response = await fetch(`${url}?v=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`Could not load ${url}: ${response.status}`);
      return response.json();
    }

    function resolveAsset(manifestUrl, assetName) {
      return new URL(assetName, new URL(manifestUrl, location.href)).href;
    }

    async function createChannelTexture(manifestUrl, configuration, channelIndex) {
      const url = resolveAsset(manifestUrl, configuration.file);
      const response = await fetch(`${url}?v=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`Texture fetch failed: ${configuration.file}`);
      const blob = await response.blob();
      const isDataTexture = channelIndex < 3;
      const bitmap = await createImageBitmap(blob, {
        colorSpaceConversion: isDataTexture ? "none" : "default",
        premultiplyAlpha: "none",
        imageOrientation: configuration.vflip ? "flipY" : "none"
      });

      const texture = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + channelIndex);
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,
                     isDataTexture ? gl.NONE : gl.BROWSER_DEFAULT_WEBGL);
      // Keep the albedo as raw sRGB bytes, matching the custom-texture
      // extension. The pixel-art shader performs the sRGB decode explicitly.
      const internalFormat = gl.RGBA8;
      gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat,
                    gl.RGBA, gl.UNSIGNED_BYTE, bitmap);

      if (configuration.filter === "mipmap") {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,
                         gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      } else {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      }
      const wrap = configuration.wrap === "repeat" ? gl.REPEAT : gl.CLAMP_TO_EDGE;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
      bitmap.close();
      loadedChannelCount += 1;
      stats.textContent = `Loading data channels… ${loadedChannelCount}/4`;
      return {
        texture,
        width: configuration.width,
        height: configuration.height
      };
    }

    async function main() {
      const [shaderBody, manifest] = await Promise.all([
        loadText(shaderFile),
        loadJson(manifestFile)
      ]);
      const fragmentSource = shaderHeader() + shaderBody
        + "\nvoid main(){mainImage(outColor,gl_FragCoord.xy);}";

      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);

      const channels = await Promise.all([0, 1, 2, 3].map((index) =>
        createChannelTexture(manifestFile, manifest.channels[`iChannel${index}`], index)
      ));

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
        -1, -1, 3, -1, -1, 3
      ]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, "position");
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

      const uniforms = {
        resolution: gl.getUniformLocation(program, "iResolution"),
        time: gl.getUniformLocation(program, "iTime"),
        mouse: gl.getUniformLocation(program, "iMouse"),
        channelResolution: gl.getUniformLocation(program, "iChannelResolution[0]")
      };
      for (let index = 0; index < 4; index++) {
        gl.uniform1i(gl.getUniformLocation(program, `iChannel${index}`), index);
      }
      gl.uniform3fv(uniforms.channelResolution, new Float32Array(
        channels.flatMap((channel) => [channel.width, channel.height, 1])
      ));

      const TAU = Math.PI * 2;
      const MIN_ELEVATION = -0.75;
      const MAX_ELEVATION = 1.40;
      const DEFAULT_CAMERA_RADIUS = 1.63;
      const MIN_CAMERA_RADIUS = 0.90;
      const MAX_CAMERA_RADIUS = 2.80;
      const mouse = {
        down: false,
        controlled: false,
        yaw: 0,
        pitch: 0.10,
        radius: DEFAULT_CAMERA_RADIUS,
        lastX: 0,
        lastY: 0
      };
      canvas.addEventListener("pointerdown", (event) => {
        if (!mouse.controlled) {
          const shaderTime = timeOffset
            + (performance.now() - started) / 1000 * timeScale;
          mouse.yaw = shaderTime * 0.16;
          mouse.pitch = 0.10 + Math.sin(shaderTime * 0.21) * 0.025;
          mouse.controlled = true;
        }
        mouse.down = true;
        mouse.lastX = event.clientX;
        mouse.lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointermove", (event) => {
        if (!mouse.down) return;
        const deltaX = event.clientX - mouse.lastX;
        const deltaY = event.clientY - mouse.lastY;
        mouse.lastX = event.clientX;
        mouse.lastY = event.clientY;
        mouse.yaw -= deltaX * 0.008;
        mouse.yaw = Math.atan2(Math.sin(mouse.yaw), Math.cos(mouse.yaw));
        mouse.pitch = Math.min(MAX_ELEVATION, Math.max(MIN_ELEVATION,
          mouse.pitch + deltaY * 0.005));
      });
      canvas.addEventListener("pointerup", (event) => {
        mouse.down = false;
        canvas.releasePointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointercancel", () => {
        mouse.down = false;
      });
      canvas.addEventListener("wheel", (event) => {
        event.preventDefault();
        mouse.radius = Math.min(MAX_CAMERA_RADIUS, Math.max(MIN_CAMERA_RADIUS,
          mouse.radius * Math.exp(event.deltaY * 0.001)));
      }, { passive: false });
      canvas.addEventListener("dblclick", () => {
        mouse.down = false;
        mouse.controlled = false;
        mouse.radius = DEFAULT_CAMERA_RADIUS;
      });

      const started = performance.now();
      let frameCount = 0;
      let statsStarted = started;
      let displayedFps = 0;
      function render(now) {
        // Keep the final still image at native resolution, but temporarily
        // reduce the ray-traced pixel count while dragging for responsive orbit.
        const interactionScale = mouse.down ? 0.65 : 1.0;
        const dpr = Math.min(devicePixelRatio || 1, 2)
          * renderScale * interactionScale;
        const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform3f(uniforms.resolution, canvas.width, canvas.height, 1);
        gl.uniform1f(uniforms.time,
          timeOffset + (now - started) / 1000 * timeScale);
        const encodedMouseX = (0.5 - mouse.yaw / TAU) * canvas.width;
        const encodedMouseY = (MAX_ELEVATION - mouse.pitch)
          / (MAX_ELEVATION - MIN_ELEVATION) * canvas.height;
        gl.uniform4f(uniforms.mouse,
          encodedMouseX,
          encodedMouseY,
          mouse.controlled ? 1 : 0,
          mouse.radius);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        frameCount++;
        if (now - statsStarted > 1000) {
          displayedFps = frameCount * 1000 / (now - statsStarted);
          frameCount = 0;
          statsStarted = now;
          stats.textContent = `${manifest.triangle_count.toLocaleString()} triangles\n`
            + `${manifest.bvh_node_count.toLocaleString()} BVH nodes\n`
            + `${canvas.width}×${canvas.height} · ${displayedFps.toFixed(1)} fps\n`
            + "Drag: orbit · Wheel: zoom · Double-click: reset";
        }
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }

    main().catch((error) => {
      status.textContent = error.stack || String(error);
      stats.textContent = "Preview failed";
      console.error(error);
    });
  </script>
</body>
</html>
